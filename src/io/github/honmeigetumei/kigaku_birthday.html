<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九星気学 年盤・月盤表示</title>
  <style>
    body { font-family: sans-serif; }
    .matrix { margin: 0.5em 0 1em; }
    .matrix-row { font-family: "Courier New", monospace; }
  </style>

<body>
  <h1>九星気学 年盤・月盤表示</h1>

  <div>

    日：<input type="number" id="dayInput" title="日を入力してください">

  <button id="calcButton">計算して表示</button>
